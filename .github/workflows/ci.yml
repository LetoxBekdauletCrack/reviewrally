name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Validate & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Run Prisma Migrations (Test DB)
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: "file:./dev.db"

      - name: Seed Database
        run: npx prisma db seed
        env:
          DATABASE_URL: "file:./dev.db"

      - name: Run Vitest Integration Suite
        run: npm test
        env:
          DATABASE_URL: "file:./dev.db"
          NODE_ENV: "test"
